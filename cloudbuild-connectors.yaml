steps:
  - id: tests
    name: python:3.11-slim
    entrypoint: sh
    args:
      - -ceu
      - |
        pip install -r services/connectors/requirements.txt
        PYTHONPATH=services/connectors python -m unittest discover -s services/connectors/tests -v
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/connectors:$BUILD_ID', 'services/connectors']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/connectors:$BUILD_ID']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        case "${_DEPLOY}" in
          true) ;;
          false) echo "Build-only run: deployment explicitly disabled."; exit 0 ;;
          *) echo "_DEPLOY must be true or false" >&2; exit 1 ;;
        esac
        read -r -a JOBS <<< "${_JOBS}"
        if [ "$${#JOBS[@]}" -eq 0 ]; then
          echo "Connector releases require _JOBS; refusing to skip deployment." >&2
          exit 1
        fi
        for JOB in "$${JOBS[@]}"; do
          if [[ ! "$$JOB" =~ ^connector-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid connector job target" >&2
            exit 1
          fi
        done
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/services/connectors"
        DIGEST=$$(gcloud artifacts docker images describe "$$IMAGE:$BUILD_ID" --format='value(image_summary.digest)')
        test -n "$$DIGEST"
        for JOB in "$${JOBS[@]}"; do
          gcloud run jobs update "$$JOB" --project="$PROJECT_ID" --region="${_REGION}" --image="$$IMAGE@$$DIGEST" --quiet
        done
substitutions:
  _REGION: europe-west2
  _JOBS: ''
  _DEPLOY: 'true'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/connectors:$BUILD_ID'
