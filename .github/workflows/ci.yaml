name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Graph tests need these; the pins come from requirements.txt so they
      # cannot drift. Installing it whole would pull torch and unstructured.
      - run: pip install $(grep -E '^(fastapi|pydantic|openpyxl|httpx|python-multipart)==' services/ingestion/requirements.txt)
      - run: PYTHONPATH=services/ingestion python -m unittest discover -s services/ingestion/tests -v

  connector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Unlike the ingestion tests, these patch requests and google.oauth2.
      - run: pip install -r services/connectors/requirements.txt
      - run: PYTHONPATH=services/connectors python -m unittest discover -s services/connectors/tests -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure fmt -check -recursive
      - run: terraform -chdir=infrastructure init -backend=false
      - run: terraform -chdir=infrastructure validate
