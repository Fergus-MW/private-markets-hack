<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" href="data:," />
    <meta name="description" content="Connect your Google workspace. Bring your emails, documents and ideas into one connected knowledge layer." />
    <title>Connect your knowledge</title>
  </head>
  <body>
    <div id="graph" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="shell">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="/">Knowledge</a>
        <a class="nav-link" href="/graphs">Knowledge graphs <span aria-hidden="true">↗</span></a>
        <a class="nav-link" href="/dashboard">QC gate <span aria-hidden="true">↗</span></a>
      </nav>
      <main>
        <section class="connect" aria-labelledby="headline">
          <h1 id="headline">Connect your knowledge.</h1>
          <a class="google-button" id="connect-google" href="/api/auth/google/start">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.2h6.7c3.9-3.6 6-8.8 6-15.1Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.2c-1.8 1.2-4 1.9-6.8 1.9-5.3 0-9.8-3.6-11.4-8.4H5.7v5.3A20.4 20.4 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.4a12.3 12.3 0 0 1 0-6.8v-5.3H5.7a20.1 20.1 0 0 0 0 17.4l6.9-5.3Z"/><path fill="#EA4335" d="M24 12.2c3 0 5.6 1 7.7 3l5.8-5.8A19.5 19.5 0 0 0 24 4 20.4 20.4 0 0 0 5.7 15.3l6.9 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/></svg>
            <span id="button-label">Connect to Google</span>
          </a>
          <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
