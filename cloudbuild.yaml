# Pushes to main build and deploy the ingestion service; Terraform owns infrastructure.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/ingestion:$BUILD_ID', 'services/ingestion']

  - id: tests
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=python
      - -e
      - PYTHONPATH=/app
      - -v
      - /workspace/services/ingestion/tests:/tests:ro
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/ingestion:$BUILD_ID'
      - -m
      - unittest
      - discover
      - -s
      - /tests
      - -v

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/ingestion:$BUILD_ID']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        case "${_DEPLOY}" in
          true) ;;
          false) echo "Build-only run: deployment explicitly disabled."; exit 0 ;;
          *) echo "_DEPLOY must be true or false" >&2; exit 1 ;;
        esac
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/services/ingestion"
        DIGEST=$$(gcloud artifacts docker images describe "$$IMAGE:$BUILD_ID" --format='value(image_summary.digest)')
        test -n "$$DIGEST"
        gcloud run services update document-ingestion \
          --project="$PROJECT_ID" --region="${_REGION}" \
          --image="$$IMAGE@$$DIGEST" --quiet

substitutions:
  _REGION: europe-west2
  _DEPLOY: 'true'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/services/ingestion:$BUILD_ID'
